# HISTORICAL NON-EXECUTABLE EVIDENCE
# Retired 2026-08-18 under Product Owner approval.
# Superseded by the canonical evidence-bound controlled-cleanup path.
# This file is preserved outside .github/workflows so the original one-shot
# implementation and its provenance remain reviewable but cannot be dispatched.
name: Production controlled residual archive

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ARCHIVE_EXACT_FIVE_CONTROLLED_ORGANISATIONS
        required: true
        type: string

jobs:
  archive-exact-five:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-beta-acceptance
    permissions:
      contents: read
    env:
      EXPECTED_PROJECT_REF: fzkrvglzompkuiodqllr
      GOVERNED_ARCHIVE_RPC: ftf_archive_controlled_commercial_onboarding
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact fixed authority and credentials
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set +x
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            value="${!name:-}"
            [[ -n "$value" ]]
            echo "::add-mask::$value"
          done
          set -euo pipefail
          [[ "$CONFIRMATION" == "ARCHIVE_EXACT_FIVE_CONTROLLED_ORGANISATIONS" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          project_ref="$(node -e 'const u=new URL(process.argv[1]);const m=/^([a-z0-9]+)\.supabase\.co$/.exec(u.hostname);if(!m)process.exit(1);process.stdout.write(m[1]);' "$SUPABASE_URL")"
          [[ "$project_ref" == "$EXPECTED_PROJECT_REF" ]]
          printf 'Authorised workflow source: %s\n' "$GITHUB_SHA"

      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts

      - name: Verify completed Production backup
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PROJECT_REF/database/backups")"
          node -e '
            const body=JSON.parse(process.argv[1]);
            const rows=Array.isArray(body)?body:(body.backups||[]);
            const completed=rows.filter((row)=>String(row.status||"").toUpperCase()==="COMPLETED")
              .sort((a,b)=>Date.parse(b.inserted_at)-Date.parse(a.inserted_at));
            const latest=completed[0];
            const age=Date.now()-Date.parse(latest?.inserted_at||"");
            if(!latest || !Number.isFinite(age) || age<0 || age>36*60*60*1000) process.exit(1);
            process.stdout.write(JSON.stringify({backupId:String(latest.id),insertedAt:latest.inserted_at,status:"COMPLETED"})+"\n");
          ' "$response"

      - name: Preflight all five exact controlled organisations
        run: node scripts/controlledResidualArchive.mjs --preflight scripts/controlledResidualArchiveManifest.json "$RUNNER_TEMP/residual-archive-snapshots.json"

      - name: Freeze genuine-data and privilege evidence
        shell: bash
        run: |
          set +x
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          trap 'unset PGPASSWORD' EXIT
          set -euo pipefail
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --file scripts/productionPreArchiveFrozenBaseline.sql
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file scripts/productionGenuineDataArchiveBaseline.sql > "$RUNNER_TEMP/genuine-before.json"
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file scripts/productionResidualArchivePrivilegeVerification.sql > "$RUNNER_TEMP/privilege-before.json"

      - name: Archive five exact controlled organisations sequentially
        run: node scripts/controlledResidualArchive.mjs --archive scripts/controlledResidualArchiveManifest.json "$RUNNER_TEMP/residual-archive-snapshots.json"

      - name: Verify controlled history and genuine-data integrity
        shell: bash
        run: |
          set +x
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          trap 'unset PGPASSWORD' EXIT
          set -euo pipefail
          awk '/-- BEGIN CONTROLLED ACCEPTANCE INTEGRITY/{active=1} active{print} /-- END CONTROLLED ACCEPTANCE INTEGRITY/{active=0}' \
            scripts/productionStateIntegrityReconciliation.sql > "$RUNNER_TEMP/controlled-integrity.sql"
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/controlled-integrity.sql"
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file scripts/productionGenuineDataArchiveBaseline.sql > "$RUNNER_TEMP/genuine-after.json"
          cmp "$RUNNER_TEMP/genuine-before.json" "$RUNNER_TEMP/genuine-after.json"

      - name: Verify privilege state remains PRE_CORRECTION
        shell: bash
        run: |
          set +x
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          trap 'unset PGPASSWORD' EXIT
          set -euo pipefail
          psql --host aws-0-ap-southeast-2.pooler.supabase.com --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr --dbname postgres --no-password --no-psqlrc \
            --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file scripts/productionResidualArchivePrivilegeVerification.sql > "$RUNNER_TEMP/privilege-after.json"
          cmp "$RUNNER_TEMP/privilege-before.json" "$RUNNER_TEMP/privilege-after.json"
          rm -f "$RUNNER_TEMP/residual-archive-snapshots.json"
