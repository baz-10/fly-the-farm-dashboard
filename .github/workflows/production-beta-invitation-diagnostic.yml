name: Production Beta Invitation Delivery Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production-beta-acceptance
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ONBOARDING_MAILBOX_URL: ${{ secrets.E2E_ONBOARDING_MAILBOX_URL }}
      E2E_ONBOARDING_MAILBOX_TOKEN: ${{ secrets.E2E_ONBOARDING_MAILBOX_TOKEN }}
    steps:
      - name: Trace failed invitation without mutation
        shell: bash
        run: |
          set +x
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY E2E_ONBOARDING_MAILBOX_URL E2E_ONBOARDING_MAILBOX_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "DIAGNOSTIC_CONFIGURATION_MISSING:${name}" >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node <<'NODE'
          const headers = {
            apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
            Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
            Accept: 'application/json',
          };
          const rest = async (path) => {
            const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/${path}`, { headers });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(`DIAGNOSTIC_DATABASE_READ_FAILED:${response.status}`);
            return body;
          };
          const applications = await rest('commercial_onboarding_applications?submitted_at=gte.2026-08-11T22%3A30%3A00Z&submitted_at=lte.2026-08-11T22%3A32%3A00Z&select=id,application_reference,intended_administrator_email,status,row_version,submitted_at,reviewed_at,updated_at&order=submitted_at.desc');
          if (applications.length !== 1) throw new Error(`DIAGNOSTIC_APPLICATION_MATCH_COUNT:${applications.length}`);
          const application = applications[0];
          const invitationRows = await rest(`commercial_onboarding_invitations?application_id=eq.${encodeURIComponent(application.id)}&select=id,application_id,status,delivery_status,delivery_provider,expires_at,sent_at,revoked_at,accepted_at,row_version,created_at,updated_at&order=created_at.desc`);
          if (invitationRows.length !== 1) throw new Error(`DIAGNOSTIC_INVITATION_MATCH_COUNT:${invitationRows.length}`);
          const invitation = invitationRows[0];
          const eventRows = await rest(`commercial_onboarding_invitation_events?invitation_id=eq.${encodeURIComponent(invitation.id)}&select=event_type,from_status,to_status,created_at&order=created_at.asc`);
          const authResponse = await fetch(`${process.env.SUPABASE_URL}/auth/v1/admin/users?page=1&per_page=1000`, { headers });
          const authBody = await authResponse.json().catch(() => ({}));
          if (!authResponse.ok) throw new Error(`DIAGNOSTIC_AUTH_READ_FAILED:${authResponse.status}`);
          const authUsers = Array.isArray(authBody?.users) ? authBody.users : Array.isArray(authBody) ? authBody : [];
          const authUser = authUsers.find((user) => String(user?.email || '').toLowerCase() === application.intended_administrator_email);
          const mailbox = new URL(process.env.E2E_ONBOARDING_MAILBOX_URL);
          mailbox.searchParams.set('recipient', application.intended_administrator_email);
          mailbox.searchParams.set('after', new Date(Date.parse(application.submitted_at) - 5000).toISOString());
          const mailboxResponse = await fetch(mailbox, { headers: { Authorization: `Bearer ${process.env.E2E_ONBOARDING_MAILBOX_TOKEN}`, Accept: 'application/json' } });
          const mailboxBody = await mailboxResponse.json().catch(() => ({}));
          const messages = Array.isArray(mailboxBody?.messages) ? mailboxBody.messages : [];
          const matchingLinks = messages.flatMap((message) => Array.isArray(message?.links) ? message.links : []).filter((value) => {
            try {
              const link = new URL(String(value));
              const redirect = link.searchParams.get('redirect_to');
              return link.searchParams.get('type') && redirect && new URL(redirect).searchParams.get('invitation') === invitation.id;
            } catch { return false; }
          });
          console.log(JSON.stringify({
            applicantAlias: application.intended_administrator_email,
            application: { exists: true, reference: application.application_reference, status: application.status, submittedAt: application.submitted_at, reviewedAt: application.reviewed_at },
            invitation: { exists: true, id: invitation.id, status: invitation.status, deliveryStatus: invitation.delivery_status, deliveryProvider: invitation.delivery_provider, createdAt: invitation.created_at, sentAt: invitation.sent_at, expiresAt: invitation.expires_at, revokedAt: invitation.revoked_at, acceptedAt: invitation.accepted_at },
            invitationEvents: eventRows,
            supabaseAuthUserExists: Boolean(authUser),
            mailbox: { status: mailboxResponse.status, messageCount: messages.length, matchingLinkCount: matchingLinks.length, receivedAt: messages.map((message) => message.receivedAt) },
          }, null, 2));
          NODE
