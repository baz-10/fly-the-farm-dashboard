name: Production Beta Secret Propagation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: production-beta-deployment
    steps:
      - name: Compare database password propagation
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          if printf '%s' "$SUPABASE_DB_PASSWORD" | node -e '
            let supplied = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { supplied += chunk; });
            process.stdin.on("end", () => {
              process.exit(supplied === (process.env.SUPABASE_DB_PASSWORD || "") ? 0 : 1);
            });
          '; then
            printf 'MATCH\n'
          else
            printf 'MISMATCH\n'
            exit 1
          fi
