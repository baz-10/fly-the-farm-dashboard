name: Production Beta Operational Acceptance

on:
  workflow_dispatch:
  repository_dispatch:
    types: [production-beta-deployed]
  schedule:
    - cron: '17 17 * * *'

permissions:
  contents: read

concurrency:
  group: production-beta-operational-acceptance
  cancel-in-progress: false

jobs:
  operational-acceptance:
    name: Client to Mission operational acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-beta-acceptance
    env:
      CI: 'true'
      E2E_BASE_URL: https://spray-command-production-beta.vercel.app
      E2E_ORGANISATION_EMAIL: ${{ secrets.E2E_ORGANISATION_EMAIL }}
      E2E_ORGANISATION_PASSWORD: ${{ secrets.E2E_ORGANISATION_PASSWORD }}

    steps:
      - name: Check out accepted source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Product Maturity Registry completeness
        run: node scripts/verifyProductMaturityRegistry.mjs

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Protect acceptance credentials in runner output
        shell: bash
        run: |
          set +x
          if [[ -n "$E2E_ORGANISATION_EMAIL" ]]; then echo "::add-mask::$E2E_ORGANISATION_EMAIL"; fi
          if [[ -n "$E2E_ORGANISATION_PASSWORD" ]]; then echo "::add-mask::$E2E_ORGANISATION_PASSWORD"; fi
          printf 'Acceptance secrets present: email=%s password=%s\n' \
            "$([[ -n "$E2E_ORGANISATION_EMAIL" ]] && echo true || echo false)" \
            "$([[ -n "$E2E_ORGANISATION_PASSWORD" ]] && echo true || echo false)"

      - name: Validate acceptance environment
        run: npx playwright test --project=environment

      - name: Prove Organisation authentication
        run: npx playwright test --project=auth

      - name: Prove deterministic acceptance cleanup
        run: npx playwright test --project=cleanup --no-deps

      - name: Run Production Beta operational acceptance
        run: npx playwright test --project=chromium --no-deps

      - name: Retain non-secret failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-beta-operational-acceptance-failure
          path: |
            test-results/playwright-report
            test-results/playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7
