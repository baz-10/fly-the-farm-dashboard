name: Production Beta Operational Acceptance

on:
  workflow_dispatch:
    inputs:
      mailbox_preflight_only:
        description: Run only the protected Preview mailbox runtime check
        required: false
        type: boolean
        default: false
      invitation_diagnostic_only:
        description: Trace the failed Production Beta invitation without mutation
        required: false
        type: boolean
        default: false
      client_to_mission_only:
        description: Run only the existing Client-to-Mission Production acceptance
        required: false
        type: boolean
        default: false
      supabase_ledger_diagnostic_only:
        description: Diagnose only the protected-runner Supabase migration ledger path
        required: false
        type: boolean
        default: false
      target_environment:
        description: Explicit protected target
        required: true
        type: choice
        options: [production]
        default: production
      expected_release_sha:
        description: Frozen Production application SHA
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      expected_release_sha:
        description: Immutable release SHA that the deployed application must report
        required: true
        type: string
    secrets:
      E2E_ONBOARDING_APPLICANT_EMAIL:
        required: false
      E2E_ONBOARDING_APPLICANT_PASSWORD:
        required: false
      E2E_ORGANISATION_EMAIL:
        required: false
      E2E_ORGANISATION_PASSWORD:
        required: false
      E2E_PLATFORM_EMAIL:
        required: false
      E2E_PLATFORM_PASSWORD:
        required: false
      E2E_ONBOARDING_MAILBOX_URL:
        required: false
      E2E_ONBOARDING_MAILBOX_TOKEN:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
  repository_dispatch:
    types: [production-beta-deployed]
  schedule:
    - cron: '17 17 * * *'

permissions:
  contents: read

env:
  TZ: Australia/Brisbane

concurrency:
  group: production-beta-operational-acceptance
  cancel-in-progress: false

jobs:
  mailbox-preview-preflight:
    name: Mailbox Preview runtime preflight
    if: ${{ inputs.mailbox_preflight_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-beta-acceptance
    env:
      MAILBOX_PREVIEW_URL: https://spray-command-production-beta-ra6pdkcu5-bjt-ftfs-projects.vercel.app
      E2E_ONBOARDING_MAILBOX_TOKEN: ${{ secrets.E2E_ONBOARDING_MAILBOX_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify mailbox Preview runtime sequence
        shell: bash
        run: |
          set +x
          [[ -n "$E2E_ONBOARDING_MAILBOX_TOKEN" ]]
          [[ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]
          echo "::add-mask::$E2E_ONBOARDING_MAILBOX_TOKEN"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          node <<'NODE'
          const preview = new URL(process.env.MAILBOX_PREVIEW_URL || '');
          if (preview.protocol !== 'https:' || preview.pathname !== '/' || !preview.hostname.endsWith('.vercel.app')) {
            throw new Error('MAILBOX_PREVIEW_URL_INVALID');
          }
          const endpoint = new URL('/api/v1/onboarding-mailbox', preview);
          endpoint.searchParams.set('recipient', `info+sc-onboarding-preflight-${process.env.GITHUB_RUN_ID}@flythefarm.com.au`);
          endpoint.searchParams.set('after', new Date(Date.now() - 300_000).toISOString());
          const response = await fetch(endpoint, {
            redirect: 'manual',
            headers: {
              Accept: 'application/json',
              Authorization: `Bearer ${process.env.E2E_ONBOARDING_MAILBOX_TOKEN}`,
              'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
            },
          });
          let body = {};
          try { body = await response.json(); } catch {}
          if (response.status !== 200) {
            const code = String(body?.error?.code || body?.error || `HTTP_${response.status}`).replace(/[^A-Z0-9_-]/gi, '_').slice(0, 100);
            throw new Error(`MAILBOX_PREFLIGHT_FAILED:${code}`);
          }
          if (!Array.isArray(body?.messages)) throw new Error('MAILBOX_PREFLIGHT_RESPONSE_INVALID');
          console.log('mailbox_endpoint_reachable=true');
          console.log('mailbox_bearer_authentication=true');
          console.log('gmail_oauth_refresh=true');
          console.log('controlled_plus_alias_query=true');
          NODE

  invitation-delivery-diagnostic:
    name: Invitation delivery diagnostic
    if: ${{ inputs.invitation_diagnostic_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-beta-acceptance
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ONBOARDING_MAILBOX_URL: ${{ secrets.E2E_ONBOARDING_MAILBOX_URL }}
      E2E_ONBOARDING_MAILBOX_TOKEN: ${{ secrets.E2E_ONBOARDING_MAILBOX_TOKEN }}
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Trace failed invitation without mutation
        shell: bash
        run: |
          set +x
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY E2E_ONBOARDING_MAILBOX_URL E2E_ONBOARDING_MAILBOX_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "DIAGNOSTIC_CONFIGURATION_MISSING:${name}" >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node scripts/diagnoseProductionInvitation.mjs

  deployment-identity:
    name: Resolve exact deployed commit
    if: ${{ inputs.mailbox_preflight_only != true && inputs.invitation_diagnostic_only != true && inputs.supabase_ledger_diagnostic_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit-sha: ${{ steps.deployment.outputs.commit-sha }}
    steps:
      - name: Resolve exact deployed commit
        id: deployment
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || github.event.client_payload.commitSha }}
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 https://spray-command-production-beta.vercel.app/api/v1/deployment)"
          deployed="$(node -e 'const value=JSON.parse(process.argv[1])?.data?.commitSha||""; if(!/^[0-9a-f]{40}$/.test(value)) process.exit(1); process.stdout.write(value)' "$payload")"
          if [[ -n "$EXPECTED_RELEASE_SHA" ]]; then
            [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            [[ "${EXPECTED_RELEASE_SHA,,}" == "$deployed" ]]
          fi
          echo "commit-sha=$deployed" >> "$GITHUB_OUTPUT"

  authentication-acceptance:
    name: Organisation authentication-only acceptance
    needs: deployment-identity
    if: ${{ inputs.client_to_mission_only != true && inputs.supabase_ledger_diagnostic_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-beta-acceptance
    env:
      CI: 'true'
      E2E_BASE_URL: https://spray-command-production-beta.vercel.app
      E2E_ORGANISATION_EMAIL: ${{ secrets.E2E_ORGANISATION_EMAIL }}
      E2E_ORGANISATION_PASSWORD: ${{ secrets.E2E_ORGANISATION_PASSWORD }}

    steps:
      - name: Check out accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.deployment-identity.outputs.commit-sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Protect acceptance credentials in runner output
        shell: bash
        run: |
          set +x
          if [[ -n "$E2E_ORGANISATION_EMAIL" ]]; then echo "::add-mask::$E2E_ORGANISATION_EMAIL"; fi
          if [[ -n "$E2E_ORGANISATION_PASSWORD" ]]; then echo "::add-mask::$E2E_ORGANISATION_PASSWORD"; fi
          printf 'Acceptance secrets present: email=%s password=%s\n' \
            "$([[ -n "$E2E_ORGANISATION_EMAIL" ]] && echo true || echo false)" \
            "$([[ -n "$E2E_ORGANISATION_PASSWORD" ]] && echo true || echo false)"
          [[ -n "$E2E_ORGANISATION_EMAIL" ]]
          [[ -n "$E2E_ORGANISATION_PASSWORD" ]]

      - name: Validate acceptance environment
        run: npx playwright test --project=environment

      - name: Prove Organisation authentication
        run: npx playwright test --project=auth

      - name: Remove authentication state
        if: always()
        run: rm -rf test-results/.auth

  commercial-onboarding-acceptance:
    name: Commercial onboarding acceptance
    needs: [deployment-identity, authentication-acceptance]
    if: ${{ inputs.client_to_mission_only != true && inputs.supabase_ledger_diagnostic_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-beta-acceptance
    env:
      CI: 'true'
      E2E_BASE_URL: https://spray-command-production-beta.vercel.app
      E2E_ONBOARDING_APPLICANT_EMAIL: ${{ secrets.E2E_ONBOARDING_APPLICANT_EMAIL }}
      E2E_ONBOARDING_APPLICANT_PASSWORD: ${{ secrets.E2E_ONBOARDING_APPLICANT_PASSWORD }}
      E2E_PLATFORM_EMAIL: ${{ secrets.E2E_PLATFORM_EMAIL }}
      E2E_PLATFORM_PASSWORD: ${{ secrets.E2E_PLATFORM_PASSWORD }}
      E2E_ONBOARDING_MAILBOX_URL: ${{ secrets.E2E_ONBOARDING_MAILBOX_URL }}
      E2E_ONBOARDING_MAILBOX_TOKEN: ${{ secrets.E2E_ONBOARDING_MAILBOX_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.deployment-identity.outputs.commit-sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Mask and validate onboarding secrets
        shell: bash
        run: |
          set +x
          missing=0
          for name in E2E_ONBOARDING_APPLICANT_EMAIL E2E_ONBOARDING_APPLICANT_PASSWORD E2E_PLATFORM_EMAIL E2E_PLATFORM_PASSWORD E2E_ONBOARDING_MAILBOX_URL E2E_ONBOARDING_MAILBOX_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            value="${!name}"
            if [[ -z "$value" ]]; then missing=1; else echo "::add-mask::$value"; fi
          done
          printf 'Commercial onboarding secrets present: %s\n' "$([[ "$missing" -eq 0 ]] && echo true || echo false)"
          [[ "$missing" -eq 0 ]]
          [[ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Verify Product Maturity Registry completeness
        run: npm run verify:product-maturity

      - name: Verify authoritative onboarding PostgreSQL lifecycle
        run: npm run verify:commercial-onboarding

      - name: Run deterministic sharded regression
        run: npm run test:ci:sharded

      - name: Load reviewed mailbox acceptance harness
        env:
          ACCEPTANCE_HARNESS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$ACCEPTANCE_HARNESS_SHA"
          git checkout "$ACCEPTANCE_HARNESS_SHA" -- \
            e2e/acceptance/commercial-onboarding.spec.ts \
            e2e/acceptance/fixtures/commercialOnboardingInvitation.ts \
            e2e/acceptance/fixtures/gettingStartedReadiness.ts

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run unattended commercial onboarding
        run: npx playwright test e2e/acceptance/commercial-onboarding.spec.ts --project=commercial-onboarding

      - name: Verify exact controlled onboarding evidence
        run: npm run verify:commercial-onboarding -- --verify-controlled test-results/commercial-onboarding-evidence.json

      - name: Archive only the controlled onboarding organisation transactionally
        if: always()
        run: |
          if [[ -f test-results/commercial-onboarding-evidence.json ]]; then
            npm run verify:commercial-onboarding -- --archive-controlled test-results/commercial-onboarding-evidence.json
          fi

      - name: Remove authentication and onboarding state
        if: always()
        run: |
          rm -rf test-results/.auth
          rm -f test-results/commercial-onboarding-evidence.json

  client-to-mission-preflight:
    name: Client-to-Mission Production preflight
    if: ${{ inputs.client_to_mission_only == true }}
    needs: deployment-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-beta-acceptance
    env:
      EXPECTED_RELEASE_SHA: 932f787d9ff9aa091a74a0543adc5d6e6be591f6
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      SUPABASE_CLI_VERSION: 2.113.0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check out reviewed acceptance source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify exact manual Production authority
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target_environment }}
          REQUESTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          DEPLOYED_RELEASE_SHA: ${{ needs.deployment-identity.outputs.commit-sha }}
        run: |
          set +x
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL; do
            value="${!name:-}"
            [[ -n "$value" ]]
            echo "::add-mask::$value"
          done
          set -euo pipefail
          [[ "$REQUESTED_TARGET" == "production" ]]
          [[ "$REQUESTED_RELEASE_SHA" == "$EXPECTED_RELEASE_SHA" ]]
          [[ "$DEPLOYED_RELEASE_SHA" == "$EXPECTED_RELEASE_SHA" ]]
          project_ref="$(node -e 'const url=new URL(process.argv[1]); const match=/^([a-z0-9]+)\.supabase\.co$/.exec(url.hostname); if(!match) process.exit(1); process.stdout.write(match[1]);' "$SUPABASE_URL")"
          [[ "$project_ref" == "$EXPECTED_SUPABASE_PROJECT_REF" ]]

      - name: Verify frozen Production deployment is healthy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error https://spray-command-production-beta.vercel.app/api/v1/deployment)"
          deployed="$(node -e 'const value=JSON.parse(process.argv[1])?.data?.commitSha||""; if(!/^[0-9a-f]{40}$/.test(value)) process.exit(1); process.stdout.write(value)' "$payload")"
          [[ "$deployed" == "$EXPECTED_RELEASE_SHA" ]]

      - name: Link exact Production database read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF"

      - name: Verify migration ledger and zero pending migrations
        shell: bash
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          printf '%s\n' "$ledger_output"
          migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          node -e 'const value=JSON.parse(process.argv[1]); const expected="20260813130000"; if(value.remoteIds.filter(id=>id===expected).length!==1) process.exit(1); if(JSON.stringify(value.repositoryIds)!==JSON.stringify(value.remoteIds)) process.exit(1);' "$migration_state"
          pending_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$pending_output"
          pending="$(printf '%s\n' "$pending_output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          node -e 'const value=JSON.parse(process.argv[1]); if(!Array.isArray(value)||value.length!==0) process.exit(1);' "$pending"

      - name: Verify archived fixture and genuine-data baseline
        shell: bash
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" db query --linked --file scripts/clientToMissionProductionPreflight.sql

  supabase-ledger-diagnostic:
    name: Protected runner Supabase migration-ledger diagnostic
    if: ${{ inputs.supabase_ledger_diagnostic_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-beta-acceptance
    env:
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      SUPABASE_CLI_VERSION: 2.113.0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify protected runner context and capture migration ledger
        shell: bash
        run: |
          set +x
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "$name=MISSING"; exit 1; }
            echo "::add-mask::$value"
            echo "$name=PRESENT"
          done
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "shell=bash"
          echo "working_directory=$GITHUB_WORKSPACE"
          echo "git_sha=$(git rev-parse HEAD)"
          echo "supabase_cli_version=$(npx --yes "supabase@$SUPABASE_CLI_VERSION" --version)"
          link_stdout="$RUNNER_TEMP/supabase-link.stdout"
          link_stderr="$RUNNER_TEMP/supabase-link.stderr"
          if ! npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF" >"$link_stdout" 2>"$link_stderr"; then
            echo "project_link=FAILED"
            node scripts/productionBetaReleaseEvidence.mjs redact-diagnostic <"$link_stdout"
            node scripts/productionBetaReleaseEvidence.mjs redact-diagnostic <"$link_stderr"
            exit 1
          fi
          linked_project_ref="$(tr -cd 'a-z0-9' < supabase/.temp/project-ref)"
          echo "linked_project_ref=$linked_project_ref"
          [[ "$linked_project_ref" == "$EXPECTED_SUPABASE_PROJECT_REF" ]]
          migration_stdout="$RUNNER_TEMP/migration-list.stdout"
          migration_stderr="$RUNNER_TEMP/migration-list.stderr"
          set +e
          npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked >"$migration_stdout" 2>"$migration_stderr"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code"
          echo "bounded_stdout_begin"
          node scripts/productionBetaReleaseEvidence.mjs redact-diagnostic <"$migration_stdout"
          echo "bounded_stdout_end"
          echo "bounded_stderr_begin"
          node scripts/productionBetaReleaseEvidence.mjs redact-diagnostic <"$migration_stderr"
          echo "bounded_stderr_end"
          if [[ "$exit_code" -eq 0 ]]; then
            migration_state="$(node scripts/productionBetaReleaseEvidence.mjs ledger-state <"$migration_stdout")"
            node -e 'const value=JSON.parse(process.argv[1]); const expected="20260813130000"; if(value.remoteIds.at(-1)!==expected) process.exit(1); if(value.remoteIds.filter(id=>id===expected).length!==1) process.exit(1); if(JSON.stringify(value.repositoryIds)!==JSON.stringify(value.remoteIds)) process.exit(1);' "$migration_state"
            echo "latest_local_migration=20260813130000"
            echo "latest_remote_migration=20260813130000"
            echo "pending_migration_count=0"
          fi
          exit "$exit_code"

  operational-acceptance:
    name: Client to Mission operational acceptance
    needs: [deployment-identity, client-to-mission-preflight, commercial-onboarding-acceptance]
    if: >-
      ${{
        always() &&
        needs.deployment-identity.result == 'success' &&
        (
          (
            inputs.client_to_mission_only == true &&
            needs.client-to-mission-preflight.result == 'success' &&
            needs.commercial-onboarding-acceptance.result == 'skipped'
          ) ||
          (
            inputs.client_to_mission_only != true &&
            needs.commercial-onboarding-acceptance.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-beta-acceptance
    env:
      CI: 'true'
      E2E_BASE_URL: https://spray-command-production-beta.vercel.app
      E2E_ORGANISATION_EMAIL: ${{ secrets.E2E_ORGANISATION_EMAIL }}
      E2E_ORGANISATION_PASSWORD: ${{ secrets.E2E_ORGANISATION_PASSWORD }}

    steps:
      - name: Check out accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.deployment-identity.outputs.commit-sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Protect acceptance credentials in runner output
        shell: bash
        run: |
          set +x
          if [[ -n "$E2E_ORGANISATION_EMAIL" ]]; then echo "::add-mask::$E2E_ORGANISATION_EMAIL"; fi
          if [[ -n "$E2E_ORGANISATION_PASSWORD" ]]; then echo "::add-mask::$E2E_ORGANISATION_PASSWORD"; fi
          printf 'Acceptance secrets present: email=%s password=%s\n' \
            "$([[ -n "$E2E_ORGANISATION_EMAIL" ]] && echo true || echo false)" \
            "$([[ -n "$E2E_ORGANISATION_PASSWORD" ]] && echo true || echo false)"
          [[ -n "$E2E_ORGANISATION_EMAIL" ]]
          [[ -n "$E2E_ORGANISATION_PASSWORD" ]]

      - name: Validate acceptance environment
        id: environment
        run: npx playwright test --project=environment

      - name: Recreate authenticated browser state
        id: authentication
        run: npx playwright test --project=auth

      - name: Prove deterministic acceptance cleanup
        id: cleanup
        run: npx playwright test --project=cleanup --no-deps

      - name: Run established Client-to-Mission gate
        id: operational
        run: npx playwright test --project=chromium --no-deps

      - name: Write safe text failure diagnostics
        if: failure()
        shell: bash
        env:
          ACCEPTED_COMMIT_SHA: ${{ needs.deployment-identity.outputs.commit-sha }}
          ENVIRONMENT_RESULT: ${{ steps.environment.outcome }}
          AUTHENTICATION_RESULT: ${{ steps.authentication.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          OPERATIONAL_RESULT: ${{ steps.operational.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/safe-diagnostics
          {
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'accepted_commit_sha=%s\n' "$ACCEPTED_COMMIT_SHA"
            printf 'environment=%s\n' "$ENVIRONMENT_RESULT"
            printf 'authentication=%s\n' "$AUTHENTICATION_RESULT"
            printf 'cleanup=%s\n' "$CLEANUP_RESULT"
            printf 'operational=%s\n' "$OPERATIONAL_RESULT"
            printf 'capture_policy=no_auth_media_no_auth_storage\n'
          } > test-results/safe-diagnostics/operational-acceptance.txt

      - name: Remove authentication state
        if: always()
        run: rm -rf test-results/.auth

      - name: Retain safe text failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
