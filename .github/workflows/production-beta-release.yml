name: Production Beta Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed 40-character commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-beta-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Product Maturity Registry
        run: npm run verify:product-maturity

      - name: Run deterministic regression
        run: npm run test:ci:sharded

      - name: Build exact release
        run: CI=false npm run build

  release:
    name: Migrate and deploy Production Beta
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-beta-deployment
    outputs:
      release-sha: ${{ steps.release_identity.outputs.release-sha }}
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment-url }}
      migration-ids: ${{ steps.migration_plan.outputs.migration-ids }}
      deployment-id: ${{ steps.vercel_ready.outputs.deployment-id }}
      deployment-timestamp: ${{ steps.vercel_ready.outputs.deployment-timestamp }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      EXPECTED_VERCEL_ORG_ID: team_1BujSKvVWPpvQrlDsHKtGPgG
      EXPECTED_VERCEL_PROJECT_ID: prj_nGHaHsgtlCakGC7bhs4BTDPqML88
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_CLI_VERSION: 2.113.0
      VERCEL_CLI_VERSION: 58.9.0
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release credentials are present
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [[ -z "$value" ]]; then missing=1; else echo "::add-mask::$value"; fi
          done
          printf 'Production Beta deployment credentials present: %s\n' "$([[ "$missing" -eq 0 ]] && echo true || echo false)"
          [[ "$missing" -eq 0 ]]

      - name: Verify immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Production Beta project binding
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUPABASE_PROJECT_REF" == "fzkrvglzompkuiodqllr" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_VERCEL_ORG_ID" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_VERCEL_PROJECT_ID" ]]
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF"

      - name: Inspect remote migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked

      - name: Dry-run repository migrations
        id: migration_plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$output"
          migration_ids="$(printf '%s\n' "$output" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => { const ids=[...new Set([...input.matchAll(/(?:^|[\\s/])(\\d{14}(?:_[A-Za-z0-9_-]+)?)(?:\\.sql)?(?=$|\\s)/gm)].map(match => match[1]))]; process.stdout.write(JSON.stringify(ids)); });')"
          echo "migration-ids=$migration_ids" >> "$GITHUB_OUTPUT"

      - name: Apply repository migrations
        id: apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked

      - name: Verify remote migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run

      - name: Deploy exact release to Vercel
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --archive=tgz --meta githubCommitSha="$RELEASE_SHA" --token "$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel READY
        id: vercel_ready
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token "$VERCEL_TOKEN"
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); const id=value.id||value.uid||""; if(!id) process.exit(1); process.stdout.write(id)' "$inspect_json")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); const raw=value.createdAt||value.created||""; if(!raw) process.exit(1); const date=new Date(typeof raw === "number" ? raw : String(raw)); if(Number.isNaN(date.valueOf())) process.exit(1); process.stdout.write(date.toISOString())' "$inspect_json")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"

      - name: Verify deployed release SHA
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 https://spray-command-production-beta.vercel.app/api/v1/deployment)"
          deployed="$(node -e 'const value=JSON.parse(process.argv[1])?.data?.commitSha||""; if(!/^[0-9a-f]{40}$/.test(value)) process.exit(1); process.stdout.write(value)' "$payload")"
          [[ "$deployed" == "${RELEASE_SHA,,}" ]]

      - name: Report partial release
        if: failure() && steps.apply_migrations.outcome == 'success'
        shell: bash
        run: |
          printf '## PARTIAL RELEASE\n\nRepository migrations were applied, but deployment or deployed-SHA verification failed. Migration history remains intact; fix forward through a reviewed commit.\n' >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    name: Production Beta Operational Acceptance
    needs: release
    uses: ./.github/workflows/production-beta-operational-acceptance.yml
    with:
      expected_release_sha: ${{ needs.release.outputs.release-sha }}

  release-record:
    name: Record Production Beta release
    needs: [release, acceptance]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write canonical release record
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release.outputs.release-sha }}
          MIGRATION_IDS: ${{ needs.release.outputs.migration-ids }}
          MIGRATION_LEDGER_VERIFIED: 'true'
          DEPLOYMENT_ID: ${{ needs.release.outputs.deployment-id }}
          DEPLOYMENT_TIMESTAMP: ${{ needs.release.outputs.deployment-timestamp }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          {
            printf '## Production Beta Release Record\n\n'
            printf '| Evidence | Value |\n|---|---|\n'
            printf '| Release SHA | `%s` |\n' "$RELEASE_SHA"
            printf '| Migration IDs | `%s` |\n' "$MIGRATION_IDS"
            printf '| Migration ledger verified | `%s` |\n' "$MIGRATION_LEDGER_VERIFIED"
            printf '| Deployment ID | `%s` |\n' "$DEPLOYMENT_ID"
            printf '| Deployment timestamp | `%s` |\n' "$DEPLOYMENT_TIMESTAMP"
            printf '| Acceptance workflow run ID | `%s` |\n' "$ACCEPTANCE_RUN_ID"
            printf '| Acceptance result | `%s` |\n' "$ACCEPTANCE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
