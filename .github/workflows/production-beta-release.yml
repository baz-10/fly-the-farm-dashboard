name: Production Beta Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed 40-character commit SHA to release
        required: true
        type: string
      rehearsal_only:
        description: Run every release gate without migrations, Production deployment, aliases or acceptance
        required: false
        default: false
        type: boolean
      secret_propagation_only:
        description: Compare protected database-secret propagation without release activity
        required: false
        default: false
        type: boolean
      connectivity_diagnostic_only:
        description: Test read-only Production Beta PostgreSQL connectivity without release activity
        required: false
        default: false
        type: boolean
      migration_definition_reconciliation_only:
        description: Compare reviewed and live PostgreSQL definitions without mutation
        required: false
        default: false
        type: boolean
      exact_sha_redeploy_only:
        description: Redeploy an approved immutable SHA without migrations
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-beta-release
  cancel-in-progress: false

jobs:
  mode-guard:
    name: Verify one release mode
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting release modes
        shell: bash
        env:
          REHEARSAL_ONLY: ${{ inputs.rehearsal_only }}
          SECRET_PROPAGATION_ONLY: ${{ inputs.secret_propagation_only }}
          CONNECTIVITY_DIAGNOSTIC_ONLY: ${{ inputs.connectivity_diagnostic_only }}
          MIGRATION_DEFINITION_RECONCILIATION_ONLY: ${{ inputs.migration_definition_reconciliation_only }}
          EXACT_SHA_REDEPLOY_ONLY: ${{ inputs.exact_sha_redeploy_only }}
        run: |
          set -euo pipefail
          selected_modes=0
          for value in "$REHEARSAL_ONLY" "$SECRET_PROPAGATION_ONLY" "$CONNECTIVITY_DIAGNOSTIC_ONLY" "$MIGRATION_DEFINITION_RECONCILIATION_ONLY" "$EXACT_SHA_REDEPLOY_ONLY"; do
            if [[ "$value" == "true" ]]; then selected_modes=$((selected_modes + 1)); fi
          done
          [[ "$selected_modes" -le 1 ]]

  validate:
    name: Validate immutable release
    needs: mode-guard
    runs-on: ubuntu-latest
    if: inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: Australia/Brisbane
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Product Maturity Registry
        run: npm run verify:product-maturity

      - name: Run deterministic regression
        run: npm run test:ci:sharded

      - name: Build exact release
        run: CI=false npm run build

  release:
    name: Migrate and deploy Production Beta
    needs: validate
    if: inputs.rehearsal_only != true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-beta-deployment
    outputs:
      release-sha: ${{ steps.release_identity.outputs.release-sha }}
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment-url }}
      repository-migration-ids: ${{ steps.pre_migration_state.outputs.repository-migration-ids }}
      pre-remote-migration-ids: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
      migration-ids: ${{ steps.migration_plan.outputs.migration-ids }}
      post-remote-migration-ids: ${{ steps.migration_ledger.outputs.post-remote-migration-ids }}
      pending-migration-ids: ${{ steps.migration_ledger.outputs.pending-migration-ids }}
      migration-ledger-verified: ${{ steps.migration_ledger.outputs.migration-ledger-verified }}
      migration-boundary-crossed: ${{ steps.migration_boundary.outputs.crossed }}
      release-attempt-timestamp: ${{ steps.migration_boundary.outputs.release-attempt-timestamp }}
      release-evidence-script: ${{ steps.migration_boundary.outputs.release-evidence-script }}
      deployment-id: ${{ steps.vercel_ready.outputs.deployment-id || steps.vercel_identity.outputs.deployment-id }}
      deployment-timestamp: ${{ steps.vercel_ready.outputs.deployment-timestamp || steps.vercel_identity.outputs.deployment-timestamp }}
      deployment-state: ${{ steps.vercel_ready.outputs.deployment-state || steps.vercel_identity.outputs.deployment-state }}
      deployed-sha-verified: ${{ steps.deployed_sha.outputs.verified }}
      migration-apply-outcome: ${{ steps.apply_migrations.outcome }}
      migration-ledger-outcome: ${{ steps.migration_ledger.outcome }}
      deployment-creation-outcome: ${{ steps.vercel_deploy.outcome }}
      deployment-identity-outcome: ${{ steps.vercel_identity.outcome }}
      deployment-ready-outcome: ${{ steps.vercel_ready.outcome }}
      deployment-metadata-outcome: ${{ steps.vercel_metadata.outcome }}
      runtime-verification-outcome: ${{ steps.deployed_sha.outcome }}
      canonical-alias-outcome: ${{ steps.canonical_alias.outcome }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      EXPECTED_VERCEL_ORG_ID: team_1BujSKvVWPpvQrlDsHKtGPgG
      EXPECTED_VERCEL_PROJECT_ID: prj_nGHaHsgtlCakGC7bhs4BTDPqML88
      PRODUCTION_BETA_ALIAS: spray-command-production-beta.vercel.app
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_CLI_VERSION: 2.113.0
      VERCEL_CLI_VERSION: 58.9.0
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release credentials are present
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [[ -z "$value" ]]; then missing=1; else echo "::add-mask::$value"; fi
          done
          printf 'Production Beta deployment credentials present: %s\n' "$([[ "$missing" -eq 0 ]] && echo true || echo false)"
          [[ "$missing" -eq 0 ]]

      - name: Verify immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Production Beta project binding
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUPABASE_PROJECT_REF" == "fzkrvglzompkuiodqllr" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_VERCEL_ORG_ID" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_VERCEL_PROJECT_ID" ]]
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF"

      - name: Capture pre-apply migration state
        id: pre_migration_state
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          printf '%s\n' "$ledger_output"
          migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          repository_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.repositoryIds))' "$migration_state")"
          pre_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$migration_state")"
          echo "repository-migration-ids=$repository_migration_ids" >> "$GITHUB_OUTPUT"
          echo "pre-remote-migration-ids=$pre_remote_migration_ids" >> "$GITHUB_OUTPUT"

      - name: Dry-run repository migrations
        id: migration_plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REPOSITORY_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.repository-migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
        run: |
          set -euo pipefail
          output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$output"
          migration_ids="$(printf '%s\n' "$output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          PLANNED_MIGRATION_IDS="$migration_ids" node scripts/productionBetaReleaseEvidence.mjs verify-plan > /dev/null
          echo "migration-ids=$migration_ids" >> "$GITHUB_OUTPUT"

      - name: Mark migration boundary
        id: migration_boundary
        shell: bash
        run: |
          set -euo pipefail
          release_evidence_script="$(node -e 'process.stdout.write(require("node:fs").readFileSync("scripts/productionBetaReleaseEvidence.mjs").toString("base64"))')"
          release_attempt_timestamp="$(node -e 'process.stdout.write(new Date().toISOString())')"
          echo "release-evidence-script=$release_evidence_script" >> "$GITHUB_OUTPUT"
          echo "release-attempt-timestamp=$release_attempt_timestamp" >> "$GITHUB_OUTPUT"
          echo "crossed=true" >> "$GITHUB_OUTPUT"

      - name: Apply repository migrations
        id: apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked

      - name: Verify remote migration ledger
        id: migration_ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PLANNED_MIGRATION_IDS: ${{ steps.migration_plan.outputs.migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          printf '%s\n' "$ledger_output"
          post_migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          post_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$post_migration_state")"
          pending_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$pending_output"
          pending_migration_ids="$(printf '%s\n' "$pending_output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          echo "post-remote-migration-ids=$post_remote_migration_ids" >> "$GITHUB_OUTPUT"
          echo "pending-migration-ids=$pending_migration_ids" >> "$GITHUB_OUTPUT"
          reconciliation="$(POST_REMOTE_MIGRATION_IDS="$post_remote_migration_ids" PENDING_MIGRATION_IDS="$pending_migration_ids" node scripts/productionBetaReleaseEvidence.mjs reconcile)"
          migration_ledger_verified="$(node -e 'const value=JSON.parse(process.argv[1]); if(value.verified !== true) process.exit(1); process.stdout.write(String(value.verified));' "$reconciliation")"
          echo "migration-ledger-verified=$migration_ledger_verified" >> "$GITHUB_OUTPUT"

      - name: Deploy exact release to Vercel
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --no-wait --archive=tgz --env SPRAY_COMMAND_RELEASE_SHA="$RELEASE_SHA" --meta githubCommitSha="$RELEASE_SHA" --token "$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Capture Vercel deployment identity
        id: vercel_identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentTimestamp)' "$deployment_evidence")"
          deployment_state="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"
          echo "deployment-state=$deployment_state" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel READY
        id: vercel_ready
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token "$VERCEL_TOKEN"
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentTimestamp)' "$deployment_evidence")"
          deployment_state="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")"
          [[ "$deployment_state" == "READY" ]]
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"
          echo "deployment-state=$deployment_state" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel deployment metadata
        id: vercel_metadata
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_ready.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          metadata_json="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.meta?.githubCommitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||!/^[0-9a-f]{40}$/.test(actual)||actual!==expected) process.exit(1); process.stdout.write(actual)' "$metadata_json" "$RELEASE_SHA"

      - name: Verify deployed release SHA
        id: deployed_sha
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl /api/v1/deployment --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --retry 6 --retry-delay 5)"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.data?.commitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||!/^[0-9a-f]{40}$/.test(actual)||actual!==expected) process.exit(1); process.stdout.write(actual)' "$payload" "$RELEASE_SHA"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Verify canonical Production Beta alias
        id: canonical_alias
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_ready.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          alias_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "https://$PRODUCTION_BETA_ALIAS" --json --token "$VERCEL_TOKEN")"
          alias_evidence="$(printf '%s\n' "$alias_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          alias_deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$alias_evidence")"
          [[ "$alias_deployment_id" == "$DEPLOYMENT_ID" ]]

      - name: Report partial release
        if: failure() && steps.apply_migrations.outcome == 'success'
        shell: bash
        run: |
          printf '## PARTIAL RELEASE\n\nThe release stopped after the migration boundary. See the canonical release record for the exact failure stage and retained evidence. Migration history remains intact; fix forward through a reviewed commit.\n' >> "$GITHUB_STEP_SUMMARY"

  exact-sha-redeploy:
    name: Redeploy exact SHA without migrations
    needs: validate
    if: inputs.exact_sha_redeploy_only == true && inputs.rehearsal_only != true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-beta-deployment
    outputs:
      release-sha: ${{ steps.redeploy_identity.outputs.release-sha }}
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment-url }}
      deployment-id: ${{ steps.vercel_ready.outputs.deployment-id }}
      deployment-timestamp: ${{ steps.vercel_ready.outputs.deployment-timestamp }}
      deployment-state: ${{ steps.vercel_ready.outputs.deployment-state }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_VERCEL_ORG_ID: team_1BujSKvVWPpvQrlDsHKtGPgG
      EXPECTED_VERCEL_PROJECT_ID: prj_nGHaHsgtlCakGC7bhs4BTDPqML88
      PRODUCTION_BETA_ALIAS: spray-command-production-beta.vercel.app
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 58.9.0
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact redeploy identity
        id: redeploy_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_VERCEL_ORG_ID" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_VERCEL_PROJECT_ID" ]]
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact release
        run: CI=false npm run build

      - name: Verify Vercel credential is present
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          [[ -n "$VERCEL_TOKEN" ]]
          echo "::add-mask::$VERCEL_TOKEN"

      - name: Deploy exact release to Vercel
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --no-wait --archive=tgz --env SPRAY_COMMAND_RELEASE_SHA="$RELEASE_SHA" --meta githubCommitSha="$RELEASE_SHA" --token "$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Capture Vercel deployment identity
        id: vercel_identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel READY
        id: vercel_ready
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token "$VERCEL_TOKEN"
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentTimestamp)' "$deployment_evidence")"
          deployment_state="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")"
          [[ "$deployment_state" == "READY" ]]
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"
          echo "deployment-state=$deployment_state" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel deployment metadata
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_ready.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          metadata_json="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.meta?.githubCommitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||actual!==expected) process.exit(1)' "$metadata_json" "$RELEASE_SHA"

      - name: Verify deployed release SHA
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl /api/v1/deployment --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --retry 6 --retry-delay 5)"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.data?.commitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||actual!==expected) process.exit(1)' "$payload" "$RELEASE_SHA"

      - name: Verify canonical Production Beta alias
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_ready.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          alias_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "https://$PRODUCTION_BETA_ALIAS" --json --token "$VERCEL_TOKEN")"
          alias_evidence="$(printf '%s\n' "$alias_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          alias_deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$alias_evidence")"
          [[ "$alias_deployment_id" == "$DEPLOYMENT_ID" ]]

  redeploy-mailbox-verification:
    name: Verify redeployed mailbox bridge
    needs: exact-sha-redeploy
    if: inputs.exact_sha_redeploy_only == true && inputs.migration_definition_reconciliation_only != true
    runs-on: ubuntu-latest
    environment: production-beta-acceptance
    steps:
      - name: Verify mailbox bridge authentication
        shell: bash
        env:
          E2E_ONBOARDING_APPLICANT_EMAIL: ${{ secrets.E2E_ONBOARDING_APPLICANT_EMAIL }}
          E2E_ONBOARDING_MAILBOX_TOKEN: ${{ secrets.E2E_ONBOARDING_MAILBOX_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +x
          for name in E2E_ONBOARDING_APPLICANT_EMAIL E2E_ONBOARDING_MAILBOX_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET; do
            value="${!name}"
            [[ -n "$value" ]]
            echo "::add-mask::$value"
          done
          after="$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%S.%3NZ)"
          response_file="$RUNNER_TEMP/redeploy-mailbox-response.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --get \
            --header "Authorization: Bearer $E2E_ONBOARDING_MAILBOX_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --data-urlencode "recipient=$E2E_ONBOARDING_APPLICANT_EMAIL" \
            --data-urlencode "after=$after" \
            https://spray-command-production-beta.vercel.app/api/v1/onboarding-mailbox)"
          if [[ "$status" != "200" ]]; then
            node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stderr.write(String(value?.error?.code||"MAILBOX_BRIDGE_VERIFICATION_FAILED"));' "$response_file"
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(value?.messages)) process.exit(1);' "$response_file"
          rm -f "$response_file"

  redeploy-acceptance:
    name: Exact-SHA redeploy operational acceptance
    needs: [exact-sha-redeploy, redeploy-mailbox-verification]
    if: inputs.exact_sha_redeploy_only == true && inputs.migration_definition_reconciliation_only != true
    uses: ./.github/workflows/production-beta-operational-acceptance.yml
    secrets: inherit
    with:
      expected_release_sha: ${{ needs.exact-sha-redeploy.outputs.release-sha }}

  rehearsal:
    name: Rehearse Production Beta release without mutation
    needs: validate
    if: inputs.rehearsal_only == true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-beta-deployment
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      EXPECTED_VERCEL_ORG_ID: team_1BujSKvVWPpvQrlDsHKtGPgG
      EXPECTED_VERCEL_PROJECT_ID: prj_nGHaHsgtlCakGC7bhs4BTDPqML88
      PRODUCTION_BETA_ALIAS: spray-command-production-beta.vercel.app
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_CLI_VERSION: 2.113.0
      VERCEL_CLI_VERSION: 58.9.0
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify rehearsal credentials are present
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [[ -z "$value" ]]; then missing=1; else echo "::add-mask::$value"; fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Production Beta project binding
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUPABASE_PROJECT_REF" == "fzkrvglzompkuiodqllr" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_VERCEL_ORG_ID" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_VERCEL_PROJECT_ID" ]]
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF"

      - name: Capture canonical Production Beta identity before rehearsal
        id: production_before
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          production_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "https://$PRODUCTION_BETA_ALIAS" --json --token "$VERCEL_TOKEN")"
          production_evidence="$(printf '%s\n' "$production_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$production_evidence")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Capture migration state before rehearsal
        id: rehearsal_pre_state
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          set +e
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          ledger_status=$?
          set -e
          if [[ "$ledger_status" -ne 0 ]]; then
            printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs redact-diagnostic >&2
            exit "$ledger_status"
          fi
          migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          repository_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.repositoryIds))' "$migration_state")"
          pre_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$migration_state")"
          echo "repository-migration-ids=$repository_migration_ids" >> "$GITHUB_OUTPUT"
          echo "pre-remote-migration-ids=$pre_remote_migration_ids" >> "$GITHUB_OUTPUT"

      - name: Dry-run repository migrations
        id: rehearsal_plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REPOSITORY_MIGRATION_IDS: ${{ steps.rehearsal_pre_state.outputs.repository-migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.rehearsal_pre_state.outputs.pre-remote-migration-ids }}
        run: |
          set -euo pipefail
          output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          migration_ids="$(printf '%s\n' "$output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          PLANNED_MIGRATION_IDS="$migration_ids" node scripts/productionBetaReleaseEvidence.mjs verify-plan > /dev/null
          echo "migration-ids=$migration_ids" >> "$GITHUB_OUTPUT"

      - name: Prove migration ledger remained unchanged
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.rehearsal_pre_state.outputs.pre-remote-migration-ids }}
          PLANNED_MIGRATION_IDS: ${{ steps.rehearsal_plan.outputs.migration-ids }}
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          post_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          post_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$post_state")"
          [[ "$post_remote_migration_ids" == "$PRE_REMOTE_MIGRATION_IDS" ]]
          pending_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          pending_ids="$(printf '%s\n' "$pending_output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          [[ "$pending_ids" == "$PLANNED_MIGRATION_IDS" ]]

      - name: Deploy exact release to Vercel Preview
        id: rehearsal_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --yes --no-wait --archive=tgz --env SPRAY_COMMAND_RELEASE_SHA="$RELEASE_SHA" --meta githubCommitSha="$RELEASE_SHA" --token "$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Capture Vercel Preview deployment identity
        id: rehearsal_identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.rehearsal_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel Preview READY
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.rehearsal_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token "$VERCEL_TOKEN"
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          [[ "$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")" == "READY" ]]

      - name: Verify Vercel Preview deployment metadata
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.rehearsal_identity.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          metadata_json="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=process.argv[2].toLowerCase(); const actual=String(value?.meta?.githubCommitSha||"").toLowerCase(); if(actual!==expected) process.exit(1)' "$metadata_json" "$RELEASE_SHA"

      - name: Verify Preview runtime release SHA
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.rehearsal_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(npx --yes "vercel@$VERCEL_CLI_VERSION" curl /api/v1/deployment --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --retry 6 --retry-delay 5)"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=process.argv[2].toLowerCase(); const actual=String(value?.data?.commitSha||"").toLowerCase(); if(actual!==expected) process.exit(1)' "$payload" "$RELEASE_SHA"

      - name: Prove canonical Production Beta remained unchanged
        shell: bash
        env:
          BEFORE_PRODUCTION_DEPLOYMENT_ID: ${{ steps.production_before.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          production_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "https://$PRODUCTION_BETA_ALIAS" --json --token "$VERCEL_TOKEN")"
          production_evidence="$(printf '%s\n' "$production_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          after_deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$production_evidence")"
          [[ "$after_deployment_id" == "$BEFORE_PRODUCTION_DEPLOYMENT_ID" ]]

      - name: Report rehearsal gates
        shell: bash
        run: |
          printf '## Production Beta release rehearsal: PASS\n\nMigration application, Production deployment, alias mutation and Production acceptance were not executed.\n' >> "$GITHUB_STEP_SUMMARY"

  diagnostic:
    name: Verify database secret propagation
    needs: mode-guard
    if: inputs.secret_propagation_only == true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true
    runs-on: ubuntu-latest
    environment: production-beta-deployment
    steps:
      - name: Compare database password propagation
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          if printf '%s' "$SUPABASE_DB_PASSWORD" | node -e '
            let supplied = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { supplied += chunk; });
            process.stdin.on("end", () => {
              process.exit(supplied === (process["env"].SUPABASE_DB_PASSWORD || "") ? 0 : 1);
            });
          '; then
            printf 'MATCH\n'
          else
            printf 'MISMATCH\n'
            exit 1
          fi

  connectivity-diagnostic:
    name: Verify read-only database connectivity
    needs: mode-guard
    if: inputs.connectivity_diagnostic_only == true && inputs.secret_propagation_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true
    runs-on: ubuntu-latest
    environment: production-beta-deployment
    steps:
      - name: Test session pooler and direct PostgreSQL
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          failed=0

          check_connection() {
            local label="$1"
            local host="$2"
            local user="$3"
            local allow_unreachable="$4"
            local output
            local status
            local safe_output

            set +e
            output="$(PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=10 psql \
              --host "$host" \
              --port 5432 \
              --username "$user" \
              --dbname postgres \
              --no-password \
              --tuples-only \
              --no-align \
              --command 'SELECT 1' 2>&1)"
            status=$?
            set -e

            safe_output="$(printf '%s' "$output" | node -e '
              let value = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { value += chunk; });
              process.stdin.on("end", () => {
                const password = process["env"].SUPABASE_DB_PASSWORD || "";
                process.stdout.write(password ? value.split(password).join("[REDACTED]") : value);
              });
            ')"

            if [[ "$status" -eq 0 ]]; then
              printf '%s: PASS\n' "$label"
              return
            fi
            if [[ "$allow_unreachable" == "true" ]] && grep -Eqi 'network is unreachable|no route to host|cannot assign requested address|name or service not known|temporary failure in name resolution|could not translate host name|connection timed out' <<< "$safe_output"; then
              printf '%s: UNREACHABLE\n' "$label"
              return
            fi
            printf '%s: FAIL\n%s\n' "$label" "$safe_output"
            failed=1
          }

          check_connection SESSION_POOLER aws-0-ap-southeast-2.pooler.supabase.com postgres.fzkrvglzompkuiodqllr false
          check_connection DIRECT_CONNECTION db.fzkrvglzompkuiodqllr.supabase.co postgres true
          exit "$failed"

  migration-definition-reconciliation:
    name: Reconcile live migration definitions
    needs: mode-guard
    if: inputs.migration_definition_reconciliation_only == true && inputs.rehearsal_only != true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.exact_sha_redeploy_only != true
    runs-on: ubuntu-latest
    environment: production-beta-deployment
    permissions:
      contents: read
    steps:
      - name: Check out reviewed diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Query PostgreSQL catalogues and compare authority
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +x
          [[ -n "$SUPABASE_DB_PASSWORD" ]]
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          trap 'unset PGPASSWORD' EXIT
          set -euo pipefail
          psql \
            --host aws-0-ap-southeast-2.pooler.supabase.com \
            --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr \
            --dbname postgres \
            --no-password \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --file scripts/defaultMaintainPrivilegeDiagnostic.sql
          psql \
            --host aws-0-ap-southeast-2.pooler.supabase.com \
            --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr \
            --dbname postgres \
            --no-password \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --file scripts/controlledEvidenceDiagnostic.sql
          psql \
            --host aws-0-ap-southeast-2.pooler.supabase.com \
            --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr \
            --dbname postgres \
            --no-password \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --file scripts/productionPrivilegeProvenance.sql
          psql \
            --host aws-0-ap-southeast-2.pooler.supabase.com \
            --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr \
            --dbname postgres \
            --no-password \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --file scripts/productionStateIntegrityReconciliation.sql
          psql \
            --host aws-0-ap-southeast-2.pooler.supabase.com \
            --port 5432 \
            --username postgres.fzkrvglzompkuiodqllr \
            --dbname postgres \
            --no-password \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --file scripts/migrationDefinitionReconciliation.sql > "$RUNNER_TEMP/live-definition.json"
          node scripts/migrationDefinitionReconciliation.cjs compare "$GITHUB_WORKSPACE" "$RUNNER_TEMP/live-definition.json"

  acceptance:
    name: Production Beta Operational Acceptance
    needs: release
    if: inputs.rehearsal_only != true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true
    uses: ./.github/workflows/production-beta-operational-acceptance.yml
    secrets: inherit
    with:
      expected_release_sha: ${{ needs.release.outputs.release-sha }}

  release-record:
    name: Record Production Beta release
    needs: [release, acceptance]
    if: inputs.rehearsal_only != true && inputs.secret_propagation_only != true && inputs.connectivity_diagnostic_only != true && inputs.migration_definition_reconciliation_only != true && inputs.exact_sha_redeploy_only != true && always() && needs.release.outputs.migration-boundary-crossed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write canonical release record
        shell: bash
        env:
          RELEASE_EVIDENCE_SCRIPT: ${{ needs.release.outputs.release-evidence-script }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT_TIMESTAMP: ${{ needs.release.outputs.release-attempt-timestamp }}
          MIGRATION_BOUNDARY_CROSSED: ${{ needs.release.outputs.migration-boundary-crossed }}
          REPOSITORY_MIGRATION_IDS: ${{ needs.release.outputs.repository-migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ needs.release.outputs.pre-remote-migration-ids }}
          MIGRATION_IDS: ${{ needs.release.outputs.migration-ids }}
          POST_REMOTE_MIGRATION_IDS: ${{ needs.release.outputs.post-remote-migration-ids }}
          PENDING_MIGRATION_IDS: ${{ needs.release.outputs.pending-migration-ids }}
          MIGRATION_LEDGER_VERIFIED: ${{ needs.release.outputs.migration-ledger-verified }}
          RELEASE_RESULT: ${{ needs.release.result }}
          MIGRATION_APPLY_OUTCOME: ${{ needs.release.outputs.migration-apply-outcome }}
          MIGRATION_LEDGER_OUTCOME: ${{ needs.release.outputs.migration-ledger-outcome }}
          DEPLOYMENT_CREATION_OUTCOME: ${{ needs.release.outputs.deployment-creation-outcome }}
          DEPLOYMENT_IDENTITY_OUTCOME: ${{ needs.release.outputs.deployment-identity-outcome }}
          DEPLOYMENT_READY_OUTCOME: ${{ needs.release.outputs.deployment-ready-outcome }}
          DEPLOYMENT_METADATA_OUTCOME: ${{ needs.release.outputs.deployment-metadata-outcome }}
          RUNTIME_VERIFICATION_OUTCOME: ${{ needs.release.outputs.runtime-verification-outcome }}
          CANONICAL_ALIAS_OUTCOME: ${{ needs.release.outputs.canonical-alias-outcome }}
          DEPLOYMENT_ID: ${{ needs.release.outputs.deployment-id }}
          DEPLOYMENT_TIMESTAMP: ${{ needs.release.outputs.deployment-timestamp }}
          DEPLOYMENT_STATE: ${{ needs.release.outputs.deployment-state }}
          DEPLOYED_SHA_VERIFIED: ${{ needs.release.outputs.deployed-sha-verified }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          evidence_script="$RUNNER_TEMP/productionBetaReleaseEvidence.mjs"
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.argv[2], "base64"))' "$evidence_script" "$RELEASE_EVIDENCE_SCRIPT"
          node "$evidence_script" record >> "$GITHUB_STEP_SUMMARY"
