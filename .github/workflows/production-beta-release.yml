name: Production Beta Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed 40-character commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-beta-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Product Maturity Registry
        run: npm run verify:product-maturity

      - name: Run deterministic regression
        run: npm run test:ci:sharded

      - name: Build exact release
        run: CI=false npm run build

  release:
    name: Migrate and deploy Production Beta
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-beta-deployment
    outputs:
      release-sha: ${{ steps.release_identity.outputs.release-sha }}
      deployment-url: ${{ steps.vercel_deploy.outputs.deployment-url }}
      repository-migration-ids: ${{ steps.pre_migration_state.outputs.repository-migration-ids }}
      pre-remote-migration-ids: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
      migration-ids: ${{ steps.migration_plan.outputs.migration-ids }}
      post-remote-migration-ids: ${{ steps.migration_ledger.outputs.post-remote-migration-ids }}
      pending-migration-ids: ${{ steps.migration_ledger.outputs.pending-migration-ids }}
      migration-ledger-verified: ${{ steps.migration_ledger.outputs.migration-ledger-verified }}
      migration-boundary-crossed: ${{ steps.migration_boundary.outputs.crossed }}
      release-attempt-timestamp: ${{ steps.migration_boundary.outputs.release-attempt-timestamp }}
      release-evidence-script: ${{ steps.migration_boundary.outputs.release-evidence-script }}
      deployment-id: ${{ steps.vercel_ready.outputs.deployment-id || steps.vercel_identity.outputs.deployment-id }}
      deployment-timestamp: ${{ steps.vercel_ready.outputs.deployment-timestamp || steps.vercel_identity.outputs.deployment-timestamp }}
      deployment-state: ${{ steps.vercel_ready.outputs.deployment-state || steps.vercel_identity.outputs.deployment-state }}
      deployed-sha-verified: ${{ steps.deployed_sha.outputs.verified }}
      migration-apply-outcome: ${{ steps.apply_migrations.outcome }}
      migration-ledger-outcome: ${{ steps.migration_ledger.outcome }}
      deployment-creation-outcome: ${{ steps.vercel_deploy.outcome }}
      deployment-identity-outcome: ${{ steps.vercel_identity.outcome }}
      deployment-ready-outcome: ${{ steps.vercel_ready.outcome }}
      deployment-metadata-outcome: ${{ steps.vercel_metadata.outcome }}
      runtime-verification-outcome: ${{ steps.deployed_sha.outcome }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_SUPABASE_PROJECT_REF: fzkrvglzompkuiodqllr
      EXPECTED_VERCEL_ORG_ID: team_1BujSKvVWPpvQrlDsHKtGPgG
      EXPECTED_VERCEL_PROJECT_ID: prj_nGHaHsgtlCakGC7bhs4BTDPqML88
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_CLI_VERSION: 2.113.0
      VERCEL_CLI_VERSION: 58.9.0
    steps:
      - name: Check out immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release credentials are present
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [[ -z "$value" ]]; then missing=1; else echo "::add-mask::$value"; fi
          done
          printf 'Production Beta deployment credentials present: %s\n' "$([[ "$missing" -eq 0 ]] && echo true || echo false)"
          [[ "$missing" -eq 0 ]]

      - name: Verify immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          RELEASE_SHA="${RELEASE_SHA,,}"
          HEAD_SHA="$(git rev-parse HEAD)"
          [[ "$HEAD_SHA" == "$RELEASE_SHA" ]]
          echo "release-sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Production Beta project binding
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUPABASE_PROJECT_REF" == "fzkrvglzompkuiodqllr" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_VERCEL_ORG_ID" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_VERCEL_PROJECT_ID" ]]
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$EXPECTED_SUPABASE_PROJECT_REF"

      - name: Capture pre-apply migration state
        id: pre_migration_state
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          printf '%s\n' "$ledger_output"
          migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          repository_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.repositoryIds))' "$migration_state")"
          pre_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$migration_state")"
          echo "repository-migration-ids=$repository_migration_ids" >> "$GITHUB_OUTPUT"
          echo "pre-remote-migration-ids=$pre_remote_migration_ids" >> "$GITHUB_OUTPUT"

      - name: Dry-run repository migrations
        id: migration_plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REPOSITORY_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.repository-migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
        run: |
          set -euo pipefail
          output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$output"
          migration_ids="$(printf '%s\n' "$output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          PLANNED_MIGRATION_IDS="$migration_ids" node scripts/productionBetaReleaseEvidence.mjs verify-plan > /dev/null
          echo "migration-ids=$migration_ids" >> "$GITHUB_OUTPUT"

      - name: Mark migration boundary
        id: migration_boundary
        shell: bash
        run: |
          set -euo pipefail
          release_evidence_script="$(node -e 'process.stdout.write(require("node:fs").readFileSync("scripts/productionBetaReleaseEvidence.mjs").toString("base64"))')"
          release_attempt_timestamp="$(node -e 'process.stdout.write(new Date().toISOString())')"
          echo "release-evidence-script=$release_evidence_script" >> "$GITHUB_OUTPUT"
          echo "release-attempt-timestamp=$release_attempt_timestamp" >> "$GITHUB_OUTPUT"
          echo "crossed=true" >> "$GITHUB_OUTPUT"

      - name: Apply repository migrations
        id: apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked

      - name: Verify remote migration ledger
        id: migration_ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PLANNED_MIGRATION_IDS: ${{ steps.migration_plan.outputs.migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ steps.pre_migration_state.outputs.pre-remote-migration-ids }}
        run: |
          set -euo pipefail
          ledger_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" migration list --linked 2>&1)"
          printf '%s\n' "$ledger_output"
          post_migration_state="$(printf '%s\n' "$ledger_output" | node scripts/productionBetaReleaseEvidence.mjs ledger-state)"
          post_remote_migration_ids="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(value.remoteIds))' "$post_migration_state")"
          pending_output="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --dry-run 2>&1)"
          printf '%s\n' "$pending_output"
          pending_migration_ids="$(printf '%s\n' "$pending_output" | node scripts/productionBetaReleaseEvidence.mjs plan)"
          echo "post-remote-migration-ids=$post_remote_migration_ids" >> "$GITHUB_OUTPUT"
          echo "pending-migration-ids=$pending_migration_ids" >> "$GITHUB_OUTPUT"
          reconciliation="$(POST_REMOTE_MIGRATION_IDS="$post_remote_migration_ids" PENDING_MIGRATION_IDS="$pending_migration_ids" node scripts/productionBetaReleaseEvidence.mjs reconcile)"
          migration_ledger_verified="$(node -e 'const value=JSON.parse(process.argv[1]); if(value.verified !== true) process.exit(1); process.stdout.write(String(value.verified));' "$reconciliation")"
          echo "migration-ledger-verified=$migration_ledger_verified" >> "$GITHUB_OUTPUT"

      - name: Deploy exact release to Vercel
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --archive=tgz --env SPRAY_COMMAND_RELEASE_SHA="$RELEASE_SHA" --meta githubCommitSha="$RELEASE_SHA" --token "$VERCEL_TOKEN")"
          [[ "$DEPLOYMENT_URL" =~ ^https://[^[:space:]]+$ ]]
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Capture Vercel deployment identity
        id: vercel_identity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentTimestamp)' "$deployment_evidence")"
          deployment_state="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")"
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"
          echo "deployment-state=$deployment_state" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel READY
        id: vercel_ready
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --wait --timeout 10m --token "$VERCEL_TOKEN"
          inspect_json="$(npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_URL" --json --token "$VERCEL_TOKEN")"
          deployment_evidence="$(printf '%s\n' "$inspect_json" | node scripts/productionBetaReleaseEvidence.mjs deployment)"
          deployment_id="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentId)' "$deployment_evidence")"
          deployment_timestamp="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentTimestamp)' "$deployment_evidence")"
          deployment_state="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.deploymentState)' "$deployment_evidence")"
          [[ "$deployment_state" == "READY" ]]
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment-timestamp=$deployment_timestamp" >> "$GITHUB_OUTPUT"
          echo "deployment-state=$deployment_state" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel deployment metadata
        id: vercel_metadata
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.vercel_ready.outputs.deployment-id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          metadata_json="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.meta?.githubCommitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||!/^[0-9a-f]{40}$/.test(actual)||actual!==expected) process.exit(1); process.stdout.write(actual)' "$metadata_json" "$RELEASE_SHA"

      - name: Verify deployed release SHA
        id: deployed_sha
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$DEPLOYMENT_URL/api/v1/deployment")"
          node -e 'const value=JSON.parse(process.argv[1]); const expected=String(process.argv[2]||"").trim().toLowerCase(); const actual=String(value?.data?.commitSha||"").trim().toLowerCase(); if(!/^[0-9a-f]{40}$/.test(expected)||!/^[0-9a-f]{40}$/.test(actual)||actual!==expected) process.exit(1); process.stdout.write(actual)' "$payload" "$RELEASE_SHA"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Report partial release
        if: failure() && steps.apply_migrations.outcome == 'success'
        shell: bash
        run: |
          printf '## PARTIAL RELEASE\n\nThe release stopped after the migration boundary. See the canonical release record for the exact failure stage and retained evidence. Migration history remains intact; fix forward through a reviewed commit.\n' >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    name: Production Beta Operational Acceptance
    needs: release
    uses: ./.github/workflows/production-beta-operational-acceptance.yml
    with:
      expected_release_sha: ${{ needs.release.outputs.release-sha }}

  release-record:
    name: Record Production Beta release
    needs: [release, acceptance]
    if: always() && needs.release.outputs.migration-boundary-crossed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write canonical release record
        shell: bash
        env:
          RELEASE_EVIDENCE_SCRIPT: ${{ needs.release.outputs.release-evidence-script }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT_TIMESTAMP: ${{ needs.release.outputs.release-attempt-timestamp }}
          MIGRATION_BOUNDARY_CROSSED: ${{ needs.release.outputs.migration-boundary-crossed }}
          REPOSITORY_MIGRATION_IDS: ${{ needs.release.outputs.repository-migration-ids }}
          PRE_REMOTE_MIGRATION_IDS: ${{ needs.release.outputs.pre-remote-migration-ids }}
          MIGRATION_IDS: ${{ needs.release.outputs.migration-ids }}
          POST_REMOTE_MIGRATION_IDS: ${{ needs.release.outputs.post-remote-migration-ids }}
          PENDING_MIGRATION_IDS: ${{ needs.release.outputs.pending-migration-ids }}
          MIGRATION_LEDGER_VERIFIED: ${{ needs.release.outputs.migration-ledger-verified }}
          RELEASE_RESULT: ${{ needs.release.result }}
          MIGRATION_APPLY_OUTCOME: ${{ needs.release.outputs.migration-apply-outcome }}
          MIGRATION_LEDGER_OUTCOME: ${{ needs.release.outputs.migration-ledger-outcome }}
          DEPLOYMENT_CREATION_OUTCOME: ${{ needs.release.outputs.deployment-creation-outcome }}
          DEPLOYMENT_IDENTITY_OUTCOME: ${{ needs.release.outputs.deployment-identity-outcome }}
          DEPLOYMENT_READY_OUTCOME: ${{ needs.release.outputs.deployment-ready-outcome }}
          DEPLOYMENT_METADATA_OUTCOME: ${{ needs.release.outputs.deployment-metadata-outcome }}
          RUNTIME_VERIFICATION_OUTCOME: ${{ needs.release.outputs.runtime-verification-outcome }}
          DEPLOYMENT_ID: ${{ needs.release.outputs.deployment-id }}
          DEPLOYMENT_TIMESTAMP: ${{ needs.release.outputs.deployment-timestamp }}
          DEPLOYMENT_STATE: ${{ needs.release.outputs.deployment-state }}
          DEPLOYED_SHA_VERIFIED: ${{ needs.release.outputs.deployed-sha-verified }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          evidence_script="$RUNNER_TEMP/productionBetaReleaseEvidence.mjs"
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.argv[2], "base64"))' "$evidence_script" "$RELEASE_EVIDENCE_SCRIPT"
          node "$evidence_script" record >> "$GITHUB_STEP_SUMMARY"
